# Run the WHOLE real base station on this laptop, on http://localhost:8088.
#
# This is the same application as docker-compose.yml — same `./django` and
# `./react` images, same nginx config, same migrations. The only differences are
# that it uses its own project name, database, and ports so it can run beside a
# real deployment without colliding with it. There is NO separate "demo mode":
# first launch requires a setup code and the coach-account rules apply exactly as
# they do on the base station.
#
# Compose interpolates this file on EVERY command (up, down, ps, logs…), so the
# secrets must be supplied each time. Keep them in .env.local (already gitignored)
# and always pass it:
#
#   docker compose -f docker-compose.local.yml --env-file .env.local up -d --build --wait
#   docker compose -f docker-compose.local.yml --env-file .env.local exec django python manage.py setup_code
#   docker compose -f docker-compose.local.yml --env-file .env.local down -v
#
# `down -v` wipes the local database; `up` alone keeps it.
name: edge-athlete-local
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: local
      POSTGRES_USER: local
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:?required}
    volumes:
      - local_db:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U local -d local"]
      interval: 3s
      timeout: 3s
      retries: 20
  mosquitto:
    image: eclipse-mosquitto:2
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "127.0.0.1:9001:9001"
  django:
    build: ./django
    environment: &backend
      POSTGRES_DB: local
      POSTGRES_USER: local
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:?required}
      SECRET_KEY: ${LOCAL_SECRET_KEY:?required}
      ALLOWED_HOSTS: localhost,127.0.0.1,django
      DEBUG: "False"
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/')"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
  monitoring-publisher:
    build: ./django
    environment: *backend
    command: python manage.py publish_monitoring_events
    depends_on:
      django:
        condition: service_healthy
  mqtt-listener:
    build: ./django
    environment: *backend
    command: python manage.py run_mqtt_subscriber
    depends_on:
      django:
        condition: service_healthy
  react:
    build: ./react
  nginx:
    image: nginx:alpine
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      django:
        condition: service_healthy
      react:
        condition: service_started
volumes:
  local_db:
