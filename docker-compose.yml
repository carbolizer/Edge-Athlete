# docker-compose.yml — the base station's wiring diagram.
# This file is the recipe for the whole Pi in one box: it starts every service
# (database, MQTT broker, Django, the one MQTT listener, the React build, and the
# Nginx front door) and plugs them into the same private network so they can find
# each other by name. Think of it as the switchboard that turns a bare Pi into
# the Edge Athlete base station with a single `docker compose up`.

services:
  postgres:
    image: postgres:15
    container_name: edgeathlete-postgres
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto
    container_name: edgeathlete-mosquitto
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
    # 1883 = plain MQTT for hardware nodes + Django. 9001 = the SAME broker
    # spoken over WebSockets so browsers can subscribe directly — no Nginx proxy.
    ports:
      - "1883:1883"
      - "9001:9001"
    restart: unless-stopped

  django:
    build: ./django
    container_name: edgeathlete-django
    env_file: .env
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started

  mqtt-listener:
    build: ./django
    container_name: edgeathlete-mqtt-listener
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    # Django (its Dockerfile CMD) is the SOLE migrator — running migrate here too
    # raced it at boot and crashed on a duplicate django_migrations table. The
    # listener only reads/writes rows once real messages arrive, long after boot.
    command: python manage.py run_mqtt_subscriber
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started

  # The OUTBOX DRAIN (merge phase P2 / D5). Separate from mqtt-listener on
  # purpose: the listener is inbound (node pulses -> DB), this is outbound
  # (committed MonitoringEvent rows -> retained MQTT invalidation). Splitting
  # them means a stall in one can't block the other. Like the listener, it does
  # NOT migrate — Django's Dockerfile CMD is the sole migrator.
  monitoring-publisher:
    build: ./django
    container_name: edgeathlete-monitoring-publisher
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    command: python manage.py publish_monitoring_events
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started

  react:
    build: ./react
    container_name: edgeathlete-react
    env_file: .env
    restart: unless-stopped
    depends_on:
      - django

  nginx:
    image: nginx:alpine
    container_name: edgeathlete-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    restart: unless-stopped
    depends_on:
      - react
      - django

  # ── ON DEMAND ───────────────────────────────────────────────────────────────
  # Everything below is a ONE-SHOT you run by name. `profiles:` is what keeps it
  # that way: a service carrying a profile is invisible to a plain
  # `docker compose up`, so nothing here can start on its own at boot. That is
  # the whole point — demo data and fake sensor traffic should only ever appear
  # because a person asked for them, out loud, at a terminal.

  # Fill an empty gym with something to look at:
  #
  #   docker compose run --rm seed
  #
  # A live training day, four athletes, the plan they train, recorded maxes, and
  # a couple of finished sets. Also (re)creates the demo coach login so /coach
  # can actually be signed into — coach / coachpass.
  #
  # Safe to run more than once. The seeder converges rather than piles up: it
  # closes any day left open, reuses the group's existing deployment instead of
  # adding another, and matches its own rows by name.
  #
  # ⚠️ IT DOES NOT PASS --reset, AND THAT IS DELIBERATE. `--reset` deletes the
  # rows the seeder considers its own — but it matches them by NAME, so on a real
  # base station it would take out any group actually called "Varsity" and any
  # athlete sharing a name with the demo four, along with their sets. If you want
  # a hard rebuild on a laptop, ask for it explicitly and say the word out loud:
  #
  #   docker compose run --rm seed python manage.py seed_active_session --reset
  seed:
    build: ./django
    env_file: .env
    profiles: ["seed"]
    command: sh -c "python manage.py seed_active_session && python manage.py ensure_demo_coach"
    # No mosquitto: seeding writes rows, it publishes nothing.
    depends_on:
      postgres:
        condition: service_healthy

  # NOTE: the reference project also ran a second `mosquitto-subscriber` service
  # (python manage.py start_mqtt_listener) alongside `mqtt-listener` above — both
  # subscribed to the same topics, double-processing every message. That duplicate
  # service is intentionally removed here; `mqtt-listener` is the ONE listener.

volumes:
  postgres_data:
