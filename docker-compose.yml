# docker-compose.yml — the base station's wiring diagram.
# This file is the recipe for the whole Pi in one box: it starts every service
# (database, MQTT broker, Django, the one MQTT listener, the React build, and the
# Nginx front door) and plugs them into the same private network so they can find
# each other by name. Think of it as the switchboard that turns a bare Pi into
# the Edge Athlete base station with a single `docker compose up`.

services:
  postgres:
    image: postgres:15
    container_name: edgeathlete-postgres
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto
    container_name: edgeathlete-mosquitto
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
    # 1883 = plain MQTT for hardware nodes + Django. 9001 = the SAME broker
    # spoken over WebSockets so browsers can subscribe directly — no Nginx proxy.
    ports:
      - "1883:1883"
      - "9001:9001"
    restart: unless-stopped

  django:
    build: ./django
    container_name: edgeathlete-django
    env_file: .env
    # The Wi-Fi password lives in the base station's config file, not .env.
    # startup.sh sources that file and exports AP_PASSWORD, and this passes it
    # through so the coach page can warn when it is still the default. Empty
    # everywhere else (a laptop has no AP), which the status endpoint reads as
    # "unknown" rather than "default". Only the boolean is ever exposed — the
    # password itself never leaves the container.
    environment:
      - AP_PASSWORD=${AP_PASSWORD:-}
    restart: unless-stopped
    # Alive AND able to serve + reach the database. `restart: unless-stopped`
    # already handles a container that CRASHES; this catches the worse case it
    # cannot see — a worker that is up and answering nothing, or came up before
    # Postgres and is failing every query. /api/health/ does a real SELECT 1.
    # start_period covers first-boot migrations, which run before gunicorn binds.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health/').status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started

  mqtt-listener:
    build: ./django
    container_name: edgeathlete-mqtt-listener
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    # Django (its Dockerfile CMD) is the SOLE migrator — running migrate here too
    # raced it at boot and crashed on a duplicate django_migrations table. The
    # listener only reads/writes rows once real messages arrive, long after boot.
    command: python manage.py run_mqtt_subscriber
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started

  # The OUTBOX DRAIN (merge phase P2 / D5). Separate from mqtt-listener on
  # purpose: the listener is inbound (node pulses -> DB), this is outbound
  # (committed MonitoringEvent rows -> retained MQTT invalidation). Splitting
  # them means a stall in one can't block the other. Like the listener, it does
  # NOT migrate — Django's Dockerfile CMD is the sole migrator.
  monitoring-publisher:
    build: ./django
    container_name: edgeathlete-monitoring-publisher
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    command: python manage.py publish_monitoring_events
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started

  react:
    build: ./react
    container_name: edgeathlete-react
    env_file: .env
    restart: unless-stopped
    depends_on:
      - django

  nginx:
    image: nginx:alpine
    container_name: edgeathlete-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    restart: unless-stopped
    # Wait for django to be HEALTHY, not merely started, so the front door does
    # not open onto 502s while migrations are still running at first boot. react
    # is static and only needs to have started.
    depends_on:
      react:
        condition: service_started
      django:
        condition: service_healthy

  # ── ON DEMAND ───────────────────────────────────────────────────────────────
  # Everything below is a ONE-SHOT you run by name. `profiles:` is what keeps it
  # that way: a service carrying a profile is invisible to a plain
  # `docker compose up`, so nothing here can start on its own at boot. That is
  # the whole point — demo data and fake sensor traffic should only ever appear
  # because a person asked for them, out loud, at a terminal.

  # Fill an empty gym with something to look at:
  #
  #   docker compose run --rm seed
  #
  # A live training day, four athletes, the plan they train, recorded maxes, and
  # a couple of finished sets. Also (re)creates the demo coach login so /coach
  # can actually be signed into — coach / coachpass.
  #
  # Safe to run more than once. The seeder converges rather than piles up: it
  # closes any day left open, reuses the group's existing deployment instead of
  # adding another, and matches its own rows by name.
  #
  # ⚠️ IT DOES NOT PASS --reset, AND THAT IS DELIBERATE. `--reset` deletes the
  # rows the seeder considers its own — but it matches them by NAME, so on a real
  # base station it would take out any group actually called "Varsity" and any
  # athlete sharing a name with the demo four, along with their sets. If you want
  # a hard rebuild on a laptop, ask for it explicitly and say the word out loud:
  #
  #   docker compose run --rm seed python manage.py seed_active_session --reset
  seed:
    build: ./django
    env_file: .env
    profiles: ["seed"]
    command: sh -c "python manage.py seed_active_session && python manage.py ensure_demo_coach"
    # No mosquitto: seeding writes rows, it publishes nothing.
    depends_on:
      postgres:
        condition: service_healthy

  # A fake rack sensor, for demoing without hardware:
  #
  #   docker compose --profile demo up -d simulator     # runs until you stop it
  #   docker compose logs -f simulator                  # watch it decide
  #
  # It publishes pulses forever, and reps ONLY while rack 1 is actually busy —
  # by default, only while a set is open there. So the room stays quiet until a
  # coach starts a set on the tablet, then reps flow, then it goes quiet again
  # when the set ends. That is both what real hardware should do and what makes
  # a demo readable.
  #
  # The rack it watches comes from the NODE's own database row, re-read every
  # couple of seconds — link the sensor to a rack mid-demo and it wakes up on
  # its own. Nothing to restart.
  #
  # Loosen or disable the gate with --active-when:
  #   checkin  publish whenever anyone is checked in at the rack
  #   always   never pause (the behaviour before the gate existed)
  #
  # Simulating a second rack is one more `run`, no compose edit needed:
  #   docker compose run --rm simulator python manage.py simulate_node --node-id rack_2
  simulator:
    build: ./django
    env_file: .env
    profiles: ["demo"]
    environment:
      - PYTHONUNBUFFERED=1      # otherwise the decisions sit in a buffer, unwatchable
    command: python manage.py simulate_node --node-id rack_1
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started

  # NOTE: the reference project also ran a second `mosquitto-subscriber` service
  # (python manage.py start_mqtt_listener) alongside `mqtt-listener` above — both
  # subscribed to the same topics, double-processing every message. That duplicate
  # service is intentionally removed here; `mqtt-listener` is the ONE listener.

volumes:
  postgres_data:
  mosquitto_data: