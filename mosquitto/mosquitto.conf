# mosquitto.conf — the broker's two front doors.
# Mosquitto is the post office every message passes through. This file gives it
# two doors into the same building: door 1883 for hardware nodes and Django
# (plain MQTT), and door 9001 for browsers (the exact same MQTT, just wrapped in
# WebSockets so a web page can walk in). Same mail, same sorting room, two doors.
# Anonymous access is fine through Sprint 3; broker auth/ACLs are a Phase 12 job.

listener 1883
allow_anonymous true

listener 9001
protocol websockets
allow_anonymous true

# Persistence: QoS 1 only actually protects a message if the broker can hold
# onto it for a client that's briefly disconnected. Without this, a "saved"
# QoS 1 message still just evaporates the moment the broker restarts - the
# setting on its own does nothing without somewhere durable to keep it.
persistence true
persistence_location /mosquitto/data/

# Throw away a saved session nobody has come back for in a day.
#
# The browser connects with clean:false, which asks the broker to KEEP a session
# per client id — and by default Mosquitto keeps those forever. Every id it has
# ever seen stays on disk with a queue attached, filling up for a client that may
# never return. Client ids include a per-tab part (see getTabId in device.js), so
# "ids it has ever seen" grows every time someone opens a tab.
#
# A day is far longer than the outage this is meant to survive — a dropped
# connection is seconds, a reboot is minutes. Anything queued for a screen that
# has been gone since yesterday is stale training data nobody wants replayed
# onto a wall display anyway.
persistent_client_expiration 1d