# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the OS, Python version, and other tools you might need
build:
  os: ubuntu-24.04
  tools:
    python: "3.13"

# Build documentation in the "docs/" directory with Sphinx.
# `fail_on_warning` stops a site with dead links from publishing — a broken
# cross-reference fails the build instead of shipping quietly.
sphinx:
   configuration: docs/conf.py
   fail_on_warning: true

# The packages the build needs. Without this, Read the Docs installs a bare
# Sphinx that cannot read Markdown, and every page fails. See docs/requirements.txt.
python:
   install:
   - requirements: docs/requirements.txt
